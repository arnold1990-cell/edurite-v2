apiVersion: v1
kind: ConfigMap
metadata:
  name: edurite-backend-config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  SPRING_CACHE_TYPE: "redis"
  DB_POOL_MAX_SIZE: "20"
  DB_POOL_MIN_IDLE: "5"
  SERVER_TOMCAT_MAX_THREADS: "250"
  SERVER_TOMCAT_ACCEPT_COUNT: "200"
  EDURITE_RATE_LIMIT_ENABLED: "true"
  MANAGEMENT_HEALTH_SHOW_DETAILS: "never"
