name: Deploy EduRite V2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30m
          command_timeout: 30m

          script: |
            set -euo pipefail

            PROJECT_DIR="/opt/edurite-v2"
            REPO_URL="https://github.com/arnold1990-cell/edurite-v2.git"

            echo "======================================"
            echo " Deploying EduRite V2 to AWS EC2"
            echo "======================================"

            echo "Host: $(hostname)"
            echo "User: $(whoami)"

            # Make sure Docker is available
            if ! command -v docker >/dev/null 2>&1; then
              echo "ERROR: Docker is not installed."
              exit 1
            fi

            if ! docker compose version >/dev/null 2>&1; then
              echo "ERROR: Docker Compose plugin is not installed."
              exit 1
            fi

            # Clone repository on first deployment
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "==> Repository not found at $PROJECT_DIR"

              sudo mkdir -p "$PROJECT_DIR"
              sudo chown -R "$(whoami):$(whoami)" "$PROJECT_DIR"

              git clone "$REPO_URL" "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            echo "==> Updating repository"

            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "==> Deploying commit:"
            git rev-parse --short HEAD

            # Production secrets/config must already exist on EC2
            if [ ! -f ".env" ]; then
              echo "ERROR: Production .env is missing:"
              echo "$PROJECT_DIR/.env"
              exit 1
            fi

            echo "==> Validating Docker Compose"
            docker compose config >/dev/null

            echo "==> Building EduRite images"
            docker compose build --progress=plain backend frontend

            echo "==> Starting services"
            docker compose up -d

            echo "==> Waiting for containers"
            sleep 10

            docker compose ps

            echo "==> Checking PostgreSQL"
            if ! docker compose exec -T postgres pg_isready; then
              echo "ERROR: PostgreSQL is not ready."
              docker compose logs --tail=100 postgres || true
              exit 1
            fi

            echo "==> Checking Redis"
            if ! docker compose exec -T redis redis-cli ping | grep -q PONG; then
              echo "ERROR: Redis is not responding."
              docker compose logs --tail=100 redis || true
              exit 1
            fi

            echo "==> Waiting for backend"

            BACKEND_OK=false

            for i in $(seq 1 30); do
              if docker compose exec -T backend \
                curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then

                BACKEND_OK=true
                echo "Backend is healthy."
                break
              fi

              echo "Waiting for backend... attempt $i/30"
              sleep 10
            done

            if [ "$BACKEND_OK" != "true" ]; then
              echo "ERROR: Backend failed health check."

              docker compose ps || true
              docker compose logs --tail=300 backend || true
              docker compose logs --tail=100 postgres || true
              docker compose logs --tail=100 redis || true

              exit 1
            fi

            echo "==> Checking frontend container"

            if ! docker compose exec -T frontend \
              wget -qO- http://127.0.0.1/ >/dev/null; then

              echo "ERROR: Frontend is not responding."
              docker compose logs --tail=200 frontend || true
              exit 1
            fi

            echo "==> Checking Vite production bundle"

            if docker compose exec -T frontend \
              test -f /usr/share/nginx/html/assets/main.js; then

              echo "ERROR: Legacy frontend bundle detected."
              exit 1
            fi

            if docker compose exec -T frontend \
              sh -lc 'grep -R "import.meta.glob" /usr/share/nginx/html/assets >/dev/null 2>&1'; then

              echo "ERROR: Frontend bundle contains unresolved import.meta.glob."
              exit 1
            fi

            echo "==> Final container status"
            docker compose ps

            echo "======================================"
            echo " EduRite V2 deployment successful"
            echo "======================================"
