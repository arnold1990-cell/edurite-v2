name: Deploy EduRite V2

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full tested main commit SHA
        required: true
      ci_run_id:
        description: Successful CI run that published this release
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: edurite-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release and successful CI provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > ci-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('ci-run.json'))
          assert run['head_sha'] == os.environ['RELEASE_SHA']
          assert run['conclusion'] == 'success' and run['status'] == 'completed'
          assert run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['path'] == '.github/workflows/ci.yml'
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          PY
          mkdir release
          gh run download "$CI_RUN_ID" --name "release-$RELEASE_SHA" --dir release
          git archive "$RELEASE_SHA" docker-compose.yml docker-compose.production.yml scripts/release.py | tar -x -C release
          python3 - <<'PY'
          import json, os
          m = json.load(open('release/release.json'))
          assert m['commit'] == os.environ['RELEASE_SHA']
          assert str(m['ci_run_id']) == os.environ['CI_RUN_ID']
          PY
          tar -czf release.tgz -C release .
      - name: Transfer release without changing production checkout
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          target="$EC2_USERNAME@$EC2_HOST"
          stage="/opt/edurite-releases/$RELEASE_SHA-$GITHUB_RUN_ID"
          ssh "$target" "umask 077; mkdir -p '$stage'"
          scp release.tgz "$target:$stage/release.tgz"
          ssh "$target" "set -eu; tar -xzf '$stage/release.tgz' -C '$stage'; python3 '$stage/scripts/release.py' deploy --release-dir '$stage' --project-dir /opt/edurite-v2 --commit '$RELEASE_SHA' --backup /opt/edurite-backups/release.dump --evidence /opt/edurite-backups/restore-evidence.json"
      - name: Record workflow outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: printf 'Release `%s` deployment workflow result %s. Host state records contain container results.\n' "$RELEASE_SHA" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
